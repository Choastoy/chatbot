<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Cardápio</title>
  <link rel="stylesheet" href="/assets/brand.css" />
  <link rel="stylesheet" href="/cardapio/cardapio.css" />
</head>
<body class="brand-bg">
  <header class="topbar">
    <div class="wrap topbar-in">
      <span class="bar-name" id="barName">…</span>
      <span class="counter" id="itemCount"></span>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <span class="kicker" id="kicker">Cardápio</span>
      <h1 class="headline hero-title" id="heroTitle">Carregando o cardápio…</h1>
      <p class="lede" id="heroLede"></p>
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
        <input id="busca" type="search" placeholder="Buscar: torresmo, vegano, drink…" autocomplete="off" />
      </label>
    </section>

    <nav class="cats" id="cats" aria-label="Categorias"></nav>

    <div id="filters" class="filters" role="group" aria-label="Filtros"></div>

    <div id="menu"></div>
    <p id="vazio" class="vazio" hidden>Nada encontrado. Tente outro termo.</p>

    <section class="info" id="info"></section>
  </main>

  <footer class="wrap foot">
    <span id="footHandle"></span>
    <a class="arrow-link" href="#top" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">topo ↑</a>
  </footer>
  <p class="wrap credit">feito com <span class="logo" style="font-size:13px">couch_<b>ai</b></span></p>

  <script src="/cardapio/cardapio.js"></script>
</body>
</html>
